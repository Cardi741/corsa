<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer Allenamento Intervallato</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* CSS di esempio se non hai styles.css oppure per integrare alcune regole utili */
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 90%;
      max-width: 1000px;
      margin: auto;
      padding: 1rem;
    }
    h1, h2, h3 {
      text-align: center;
    }
    .accordion {
      margin: 2rem 0;
    }
    .accordion-section {
      border: 1px solid #ccc;
      margin-bottom: 1rem;
      border-radius: 4px;
      background: #fff;
    }
    .accordion-header {
      background: #ddd;
      padding: 10px;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .accordion-content {
      padding: 10px;
      display: none;
    }
    .fixed-timer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #333;
      color: #fff;
      padding: 1rem;
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
    }
    .timer-display {
      text-align: center;
    }
    .timer-display h2 {
      margin-bottom: 10px;
    }
    .controls button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Titolo: sempre visibile in alto -->
    <h1>Timer Allenamento Intervallato</h1>
    
    <!-- Sezione Accordion: contiene le tre macro aree -->
    <div class="accordion">
      <!-- Sezione 1: Allenamento Intervallato e Pre-set -->
      <div class="accordion-section">
        <div class="accordion-header">Allenamento Intervallato e Pre-set</div>
        <div class="accordion-content">
          <!-- Impostazioni base -->
          <div class="settings">
            <label for="workTime">Tempo di lavoro (sec):</label>
            <input type="number" id="workTime" value="30">
            
            <label for="restTime">Tempo di recupero (sec):</label>
            <input type="number" id="restTime" value="15">
            
            <label for="rounds">Numero di round:</label>
            <input type="number" id="rounds" value="5">
            
            <button id="saveSettings">Salva Allenamento</button>
            <button id="loadSettings">Carica Allenamento</button>
          </div>
          
          <!-- Pre-set -->
          <div class="presets">
            <h3>Seleziona un Allenamento Pre-set</h3>
            <button class="preset" id="preset-hiit">HIIT (20s lavoro / 10s recupero / 8 round)</button>
            <button class="preset" id="preset-tabata">Tabata (30s lavoro / 10s recupero / 8 round)</button>
            <button class="preset" id="preset-pwm">PWM (40s lavoro / 20s recupero / 6 round)</button>
            <button class="preset" id="preset-corsa">Corsa (20s veloce / 40s lenta / 20 round)</button>
          </div>
        </div>
      </div>
      
      <!-- Sezione 2: Coda degli esercizi -->
      <div class="accordion-section">
        <div class="accordion-header">Coda degli esercizi</div>
        <div class="accordion-content">
          <div class="queue">
            <h3>Coda degli esercizi</h3>
            <div class="queue-inputs">
              <label for="queue-workTime">Tempo Fase Lavoro (sec):</label>
              <input type="number" id="queue-workTime" value="20">
              
              <label for="queue-restTime">Tempo Fase Recupero (sec):</label>
              <input type="number" id="queue-restTime" value="10">
              
              <button id="addRound">Aggiungi Round</button>
            </div>
            <ul id="queueList"></ul>
          </div>
        </div>
      </div>
      
      <!-- Sezione 3: Esercizi di Rapidità -->
      <div class="accordion-section">
        <div class="accordion-header">Esercizi di Rapidità</div>
        <div class="accordion-content">
          <div class="rapidita">
            <h3>Esercizio di Rapidità</h3>
            <label for="minSeconds">Secondi Minimi:</label>
            <input type="number" id="minSeconds" value="20">
            <label for="maxSeconds">Secondi Massimi:</label>
            <input type="number" id="maxSeconds" value="90">
            <button id="startRapidita">Avvia Rapidità</button>
            <div id="rapidita-status"></div>
          </div>
        </div>
      </div>
      
    </div>
    
    <!-- Timer Fisso: sempre visibile in basso -->
    <div class="fixed-timer">
      <div class="timer-display">
        <h2 id="phase">In attesa...</h2>
        <div id="time-left">00:00</div>
      </div>
      <div class="controls">
        <button id="startButton">Avvia</button>
        <button id="pauseButton" disabled>Pausa</button>
      </div>
    </div>
    
    <!-- Inserisci il file audio per il beep -->
    <audio id="beep" src="beep.mp3" preload="auto"></audio>
  </div>
  
  <script>
    /***************************
     *  Funzionalità Accordion *
     ***************************/
    document.querySelectorAll('.accordion-header').forEach(header => {
      header.addEventListener('click', () => {
        const content = header.nextElementSibling;
        content.style.display = (content.style.display === "block") ? "none" : "block";
      });
    });
    
    /**********************************
     * Timer: Lavoro/Recupero con Beep *
     **********************************/
    
    // Elementi HTML del timer
    const phaseDisplay = document.getElementById('phase');
    const timeLeftDisplay = document.getElementById('time-left');
    const startButton = document.getElementById('startButton');
    const pauseButton = document.getElementById('pauseButton');
    const beepAudio = document.getElementById('beep');
    
    // Input per le impostazioni
    const inputWorkTime = document.getElementById('workTime');
    const inputRestTime = document.getElementById('restTime');
    const inputRounds = document.getElementById('rounds');
    
    // Variabili per il timer
    let timerInterval = null;
    let currentPhase = 'work'; // "work" oppure "rest"
    let currentRound = 0;
    let totalRounds = 0;
    let remainingTime = 0;
    
    // Funzione per formattare il tempo (mm:ss)
    function formatTime(seconds) {
      let m = Math.floor(seconds / 60);
      let s = seconds % 60;
      m = m < 10 ? "0" + m : m;
      s = s < 10 ? "0" + s : s;
      return `${m}:${s}`;
    }
    
    // Aggiorna il display del timer
    function updateTimerDisplay() {
      timeLeftDisplay.textContent = formatTime(remainingTime);
      phaseDisplay.textContent = currentPhase === 'work' ? "Fase di LAVORO" : "Fase di RECUPERO";
    }
    
    // Funzione per far suonare il beep, con gestione degli errori (alcuni browser richiedono interazione)
    function playBeep() {
      beepAudio.play().catch(error => {
        console.log("Impossibile riprodurre il suono:", error);
      });
    }
    
    // Funzione che gestisce il tick del timer
    function timerTick() {
      remainingTime--;
      updateTimerDisplay();
    
      // Se il countdown arriva a zero…
      if (remainingTime < 0) {
        // Suona il beep alla fine di ogni fase
        playBeep();
    
        // Se la fase corrente è di lavoro, passa alla fase di recupero
        if (currentPhase === 'work') {
          currentPhase = 'rest';
          remainingTime = parseInt(inputRestTime.value, 10);
        } else {
          // Se la fase era di recupero, incrementa il round
          currentRound++;
          // Se abbiamo raggiunto il numero totale di round, ferma il timer e notifica
          if (currentRound >= totalRounds) {
            clearInterval(timerInterval);
            timerInterval = null;
            phaseDisplay.textContent = "Allenamento completato!";
            remainingTime = 0;
          } else {
            // Altrimenti, ripristina la fase di lavoro
            currentPhase = 'work';
            remainingTime = parseInt(inputWorkTime.value, 10);
          }
        }
        updateTimerDisplay();
      }
    }
    
    // Funzione per avviare il timer
    function startTimer() {
      // Leggi le impostazioni
      const workTimeVal = parseInt(inputWorkTime.value, 10);
      const restTimeVal = parseInt(inputRestTime.value, 10);
      totalRounds = parseInt(inputRounds.value, 10);
    
      // Inizializza il timer solo se i valori sono validi
      if (workTimeVal > 0 && restTimeVal > 0 && totalRounds > 0) {
        currentPhase = 'work';
        currentRound = 0;
        remainingTime = workTimeVal;
        updateTimerDisplay();
        startButton.disabled = true;
        pauseButton.disabled = false;
    
        // Avvia il countdown ogni secondo
        timerInterval = setInterval(timerTick, 1000);
      } else {
        alert("Controlla i valori inseriti per lavoro, recupero e round.");
      }
    }
    
    // Funzione per mettere in pausa il timer
    function pauseTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        startButton.disabled = false;
        pauseButton.disabled = true;
      }
    }
    
    // Gestori per i pulsanti
    startButton.addEventListener('click', startTimer);
    pauseButton.addEventListener('click', pauseTimer);
    
    // Inizializza il display del timer
    updateTimerDisplay();
    
    /********************************************
     * Eventuali Gestori per Preset e Impostazioni *
     ********************************************/
    
    // Esempio di preset: HIIT (20s lavoro / 10s recupero / 8 round)
    document.getElementById('preset-hiit').addEventListener('click', () => {
      inputWorkTime.value = 20;
      inputRestTime.value = 10;
      inputRounds.value = 8;
    });
    // Aggiungi ulteriori preset se necessario...
    
    // Gli eventi per "Salva Allenamento", "Carica Allenamento" e "Coda degli esercizi"
    // possono essere gestiti integrando localStorage o una logica specifica
    // Questo esempio fornisce la base per il timer con beep.
    
  </script>
</body>
</html>
